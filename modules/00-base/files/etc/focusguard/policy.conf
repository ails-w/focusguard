# FocusGuard — fuente unica de configuracion.
# Edita SOLO este archivo: focusguard-render lo convierte en la regla de pam_time.
# Cambia USER y las ventanas por las tuyas (los valores de abajo son EJEMPLO).

# Cuenta a restringir.
USER="alice"

# Terminales a los que aplica la regla ("*" = cualquiera).
TTY="*"

# Servicios PAM afectados: login grafico, consola, ssh y escalada de privilegios.
SERVICES="sddm|login|sshd|sudo"

# Ventanas permitidas (HHMM-HHMM). Dias de semana y fin de semana.
ALLOWED_WD="0700-0900 1800-2200"
ALLOWED_WK="1000-1400"

# Avisos, en minutos antes del cierre de la ventana.
WARN_MINUTES="60 30 15 5"
